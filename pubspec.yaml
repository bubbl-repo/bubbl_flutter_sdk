name: bubbl_flutter_sdk
description: "Flutter wrapper for Bubbl native SDKs (Android/iOS)."
version: 2.2.0
homepage: https://bubbl.tech

environment:
  sdk: ^3.11.0
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: tech.bubbl.bubbl_flutter_sdk
        pluginClass: BubblFlutterSdkPlugin
      ios:
        pluginClass: BubblFlutterSdkPlugin
